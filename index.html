<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

    <!--appel polices NewsReader et Manrope via googlefonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet">

    <!-- appel feuille de style CSS-->
    <link rel="stylesheet" href="css/style.css">

    <!-- pré-chargement de l'icône d'erreur réseau-->
    <link rel="preload" as="image" href="assets/icons/static/unavailable.svg">

    <!--appel script js-->
    <script type="module" src="./js/main.js" defer></script>

    <title>MétéoSpot</title>
</head>
<body>
    <header>
        <div id="header-titles">
            <h1 id="app-title">MétéoSpot</h1>
            <p class="app-slogan">Votre météo d'ici et d'ailleurs</p>
        </div>
        <form id="search">
            <label for="search-bar"></label>
            <input id="search-bar" type="search" value="" placeholder="Rechercher une ville ...">
        </form>
        <div class="searched-towns">
            <!-- attribuer une double classe pour l'onglet actif-->
            <!--type button pour gérer l'accessibilité et l'interaction avec le clavier-->
        </div>
    </header>
    <main>
        <section class="current-weather"></section>
        <section class="hourly-forecast forecast-section" hidden>
            <h2>Prochaines 24 heures</h2>
        </section>
        <section class="daily-forecast forecast-section" hidden>
            <h2> 4 prochains jours</h2>
        </section>
        <section class="weather-extremes"></section>
    </main>
    <footer>
        <div class="footer-section">
            <section class="footer-titles">
                <h3 id = footer-title>MétéoSpot</h3>
                <p class="app-slogan">Votre météo d'ici et d'ailleurs</p>
            </section>
            <section class="legal-informations">
                <button type="button" class="legal-link">Informations légales</button>
            </section>
            <section class="contact">
                <p class="contact-mail">Contact :
                    <span class="mail" data-contact-mail></span>
                </p>
            </section>
            <section class="informations">
                <p class="api-attribution">Weather data provided by <a class="openweather-link" href="https://openweathermap.org/">OpenWeather</a>
                    <img id="openweather-logo" src="assets/images/OpenWeather-Master-Logo RGB.png" alt="">
                </p>
            </section>
            <section class="copyright">
                <p> &copy; 2026 MétéoSpot</p>
            </section>
        </div>
    </footer>
</body>
</html>
