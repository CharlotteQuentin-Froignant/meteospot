<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

    <!--pré-chargement des polices-->
    <link rel="preload" href="assets/fonts/manrope-v23-latin-500.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/newsreader-v26-latin-600.woff2" as="font" type="font/woff2" crossorigin>

    <!-- appel feuille de style CSS-->
    <link rel="stylesheet" href="css/style.css">

    <!-- pré-chargement de l'icône d'erreur réseau-->
    <link rel="preload" as="image" href="assets/icons/static/unavailable.svg">

    <!--appel script js-->
    <script type="module" src="./js/main.js"></script>

    <title>MétéoSpot</title>
</head>
<body>
    <header>
        <div id="header-titles">
            <h1 id="app-title">MétéoSpot</h1>
            <p class="app-slogan">Votre météo d'ici et d'ailleurs</p>
        </div>
        <form id="search">
            <input id="search-bar" type="search" value="" placeholder="Rechercher une ville ..." aria-label="Rechercher une ville">
        </form>
        <div class="searched-towns">
        </div>
    </header>
    <main>
        <section class="current-weather"></section>
        <section class="hourly-forecast forecast-section" hidden>
            <h2>Les heures à venir</h2>
        </section>
        <section class="daily-forecast forecast-section" hidden>
            <h2> Les jours suivants</h2>
        </section>
    </main>
    <footer>
        <div class="footer-section">
            <section class="footer-titles">
                <h3 id ="footer-title">MétéoSpot</h3>
                <p class="app-slogan">Votre météo d'ici et d'ailleurs</p>
            </section>
            <div class="legal-informations">
                <button type="button" class="legal-link">Informations légales</button>
            </div>
            <section class="contact">
                <h3 class="contact-mail">Contact</h3>
                <p class="mail" data-contact-mail></p>
            </section>
            <div class="informations">
                <p class="api-attribution">Weather data provided by <a class="openweather-link" href="https://openweathermap.org/">OpenWeather</a>
                    <img id="openweather-logo" src="assets/images/OpenWeatherLogo.png" alt="">
                </p>
            </div>
            <div class="copyright">
                <p> &copy; 2026 MétéoSpot</p>
            </div>
        </div>
    </footer>
    <dialog id ="legal-dialog" aria-labelledby="legal-title">
        <div class="legal-header">
            <h2 id="legal-title">Informations légales</h2>
            <button type="button" class="legal-close" aria-label="Fermer">&times;</button>
        </div>
        <p class="legal-body">Chargement ...</p>
    </dialog>
</body>
</html>
