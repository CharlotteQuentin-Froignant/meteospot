<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

    <!--appel polices NewsReader et Manrope via googlefonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet">

    <!-- appel feuille de style CSS-->
    <link rel="stylesheet" href="css/style.css">

    <!--appel script js-->
    <script type="module" src="./js/main.js" defer></script>

    <title>MétéoSpot</title>
</head>
<body>
    <header>
        <div id="header-titles">
            <h1 id="app-title">MétéoSpot</h1>
            <p id="app-slogan">Votre météo d'ici et d'ailleurs</p>
        </div>
        <form id="search">
            <label for="search-bar"></label>
            <input id="search-bar" type="search" value="" placeholder="Rechercher une ville ...">
        </form>
        <div class="searched-towns">
            <!-- attribuer une double classe pour l'onglet actif-->
            <!--type button pour gérer l'accessibilité et l'interaction avec le clavier-->
        </div>
    </header>
    <main>
        <section class="current-weather">
            <svg class="solar-bow" viewBox="0 0 340 90">
                <path class="bow" d="M 10 78 Q 170 -20 330 78"></path>
                <circle class="sun" cx="150" cy="30" r="10"></circle>
                <circle class="halo" cx="150" cy="30" r="15"></circle>
            </svg>
        </section>
        <section class="hourly-forecast">
            <h2>Prochaines 24 heures</h2>
        </section>
        <section class="daily-forecast"></section>
        <section class="weather-extremes"></section>
    </main>
    <footer></footer>
</body>
</html>
